<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roz-ier: FAST Channels Schedule Grid</title><link rel="icon" href="roz-logo.png"><style>:root{--navy:#0D1551;--royal:#1750A8;--teal:#1C7293;--cyan:#49C0EF;--text:#0B1A3E;--gray:#5E5E5E;--light:#F4F5F8;--rule:#E5E7EB;--font:"Helvetica Neue",Helvetica,"Avenir Next",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:var(--font);color:var(--gray);background:#fff;display:flex;flex-direction:column;font-size:13px}header{padding:14px 24px 10px;border-bottom:1px solid var(--rule)}h1{margin:0 0 10px;font-size:22px;color:var(--text);font-weight:700;display:flex;align-items:center;gap:12px}h1 .logo{height:48px;width:auto}.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,input,button{font:inherit;border:1px solid #D6D8DE;border-radius:8px;padding:7px 10px;background:#fff;color:var(--text)}select:focus,input:focus{outline:2px solid var(--cyan);outline-offset:1px}button{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}button:hover{background:var(--royal)}button:disabled{opacity:.35;cursor:default}#q{width:230px}.nav{margin-left:auto;color:var(--royal);text-decoration:none;border-bottom:1px solid currentColor}.leg{display:flex;gap:14px;align-items:center}.leg i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-2px;border-radius:2px}#sum{color:var(--text);font-weight:700}#wrap{flex:1;overflow:auto;position:relative}#grid{position:relative}.row{display:flex;height:48px;border-bottom:1px solid var(--rule)}.row.hdr{height:34px;position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid #C9CCD6}.name{position:sticky;left:0;z-index:5;flex:none;width:var(--lw,320px);background:#fff;padding:7px 12px;border-right:1px solid #C9CCD6;display:flex;flex-direction:column;justify-content:center}.rs{position:absolute;top:0;bottom:0;right:-4px;width:9px;cursor:col-resize;z-index:9;touch-action:none}.rs:hover,.rs.on{background:rgba(23,80,168,.35)}.hdr .name{z-index:7;font-weight:700;color:var(--text);justify-content:center}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:#C9CCD6}.nn{color:var(--text);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nc{font-size:11px}.lane{position:relative;flex:none}.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--rule);padding:9px 0 0 5px;font-size:11px;color:var(--text);white-space:nowrap}.tick.hr{border-left-color:#C9CCD6}.gl{position:absolute;top:0;bottom:0;border-left:1px solid var(--rule)}.a{position:absolute;top:5px;height:38px;border-radius:4px;padding:4px 6px;overflow:hidden;white-space:nowrap;color:#fff;cursor:default}.a .l1{display:block;font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis}.a .l2{display:block;font-size:10.5px;opacity:.9}.a.or{background:var(--navy)}.a.re{background:var(--light);color:var(--text);border:1px solid var(--royal)}.a.x{background:var(--teal)}.a.dim{opacity:.18}.a:hover{outline:2px solid var(--cyan);z-index:2}#tip{position:fixed;display:none;z-index:50;max-width:340px;background:var(--navy);color:#fff;border-radius:8px;padding:10px 12px;line-height:1.45;pointer-events:none}#tip b{font-size:13px}#tip .desc{margin:6px 0;padding-top:6px;border-top:1px solid #5a63a0;font-size:12px}#tip .warn{color:#fff;margin-top:4px;border-top:1px solid #5a63a0;padding-top:4px}.stale{background:#FFF4E0;border-left:4px solid #F29A2E;color:#0B1A3E;padding:10px 16px;font-size:13px;line-height:1.4}footer{background:linear-gradient(90deg,#0D1551 0%,#1C7293 100%);color:#fff;padding:10px 24px;display:flex;justify-content:space-between;gap:16px;font-size:12px}</style></head><body><header><h1><img class="logo" src="roz-logo.png" alt="Roz"><span>Roz-ier: FAST Channels Schedule Grid</span></h1><div class="ctl"><button id="prev">&larr;</button><select id="day"></select><button id="next">&rarr;</button><select id="tz"></select><input id="q" type="search" placeholder="Search title, Radar ID, house #, series"><a class="nav" href="runway.html">Runway report</a><span id="sum">Loading schedule...</span><span class="leg"><span><i style="background:#3A9D48;border-radius:50%"></i>Runway dot: red / amber / green</span><span><i style="background:#0D1551"></i>Original</span><span><i style="background:#F4F5F8;border:1px solid #1750A8"></i>Re-air</span><span><i style="background:#1C7293"></i>Live / non-episode</span></span></div></header><div id="stale"></div><div id="wrap"><div id="grid"></div></div><div id="tip"></div><footer><span>For Internal Use Only · Private &amp; Confidential</span><span id="meta"></span></footer><script>(function viewer(){
function toMs(s){if(!s)return null;var t=Date.parse(String(s).replace(/([+-]\d\d)(\d\d)$/,'$1:$2'));return isNaN(t)?null:t}
function adapt(G){var ds=[],di={};var nets=G.networks.map(function(n){return{n:n.name,rows:n.airings.map(function(a){var k=0;if(a.d){k=di[a.d];if(!k){ds.push(a.d);k=ds.length;di[a.d]=k}}
return[a.s,a.e,a.t,a.se,a.ep,a.sy,a.rd,a.ra,a.k||null,a.lv,a.h||'','',a.sr||'',toMs(a.oa),k,a.r,a.v]})}});return{nets:nets,ds:ds,asof:G.asof_ms}}
var RW={};
function staleMsg(asof){var now=Date.now();if(now-asof<26*36e5)return'';
function pt(ms,o){return new Intl.DateTimeFormat('en-US',Object.assign({timeZone:'America/Los_Angeles'},o)).format(new Date(ms))}
var wd=pt(asof,{weekday:'short'});
if(wd==='Fri'||wd==='Sat'||wd==='Sun'){var t=asof;for(var i=0;i<200;i++){t+=36e5;if(pt(t,{weekday:'short'})==='Mon'&&+pt(t,{hour:'numeric',hourCycle:'h23'})===9)break}if(now<t)return''}
var h=(now-asof)/36e5,age=h<48?Math.round(h)+' hours':(h/24).toFixed(1)+' days';
return'<b>This data is '+age+' old</b> (last refreshed '+pt(asof,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' PT). The daily refresh may not have run, so these numbers may be out of date.'}
function start(D){var sm=staleMsg(D.asof);if(sm){var sb=document.getElementById("stale");sb.className="stale";sb.innerHTML=sm}
var PPM=3.4,LW=320,RH=48,curW=0;
try{var sv=+localStorage.getItem('roz-lw');if(sv>=160&&sv<=700)LW=sv}catch(e){}
document.documentElement.style.setProperty('--lw',LW+'px');
var TZS=[['US Eastern','America/New_York'],['UTC','UTC'],['US Central','America/Chicago'],['US Pacific','America/Los_Angeles']];
var tz=(function(){var z='';try{z=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}var m={'America/Los_Angeles':'America/Los_Angeles','America/Chicago':'America/Chicago','America/New_York':'America/New_York','UTC':'UTC','Etc/UTC':'UTC'};return m[z]||TZS[0][1]})(),dayIdx=0,days=[],q='';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function parts(ms,z){var o={};new Intl.DateTimeFormat('en-US',{timeZone:z,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(ms)).forEach(function(p){o[p.type]=p.value});return o}
function off(ms,z){var p=parts(ms,z);return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute)-Math.floor(ms/60000)*60000}
function mid(y,m,d,z){var g=Date.UTC(y,m-1,d),o=off(g,z),r=g-o,o2=off(r,z);if(o2!==o)r=g-o2;return r}
function fmt(ms,opt){return new Intl.DateTimeFormat('en-US',Object.assign({timeZone:tz},opt)).format(new Date(ms))}
function tm(ms){return fmt(ms,{hour:'numeric',minute:'2-digit'})}
var minS=1e15,maxE=0;D.nets.forEach(function(n){n.rows.forEach(function(r){if(r[0]<minS)minS=r[0];if(r[1]>maxE)maxE=r[1]})});
function buildDays(){days=[];var p=parts(Date.now(),tz),y=+p.year,m=+p.month,d=+p.day;for(var i=0;i<=28;i++){var dt=new Date(Date.UTC(y,m-1,d+i));var s=mid(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate(),tz);var nx=new Date(Date.UTC(y,m-1,d+i+1));days.push({s:s,e:mid(nx.getUTCFullYear(),nx.getUTCMonth()+1,nx.getUTCDate(),tz)})}}
function isEp(r){return r[3]&&r[4]&&r[3]!=='0'&&r[4]!=='0'}
function mism(r){var m=/Season (\d+) Episode (\d+)/.exec(r[2]||'');return m&&isEp(r)&&(m[1]!==String(r[3])||m[2]!==String(r[4]))}
var tip=document.getElementById('tip');
function showTip(e,r,n){var h='<b>'+esc(r[2])+'</b><div>'+esc(n.n)+'</div><div>'+fmt(r[0],{weekday:'short',month:'short',day:'numeric'})+' '+tm(r[0])+' - '+tm(r[1])+' ('+Math.round((r[1]-r[0])/60000)+' min)</div>';
if(isEp(r))h+='<div>Season '+esc(r[3])+', Episode '+esc(r[4])+(r[5]?' &middot; Season year '+esc(r[5]):'')+'</div>';
if(r[12])h+='<div>Series: '+esc(r[12])+'</div>';if(r[13])h+='<div>Original air date: '+fmt(r[13],{month:'short',day:'numeric',year:'numeric'})+'</div>';var rp=[];if(r[15])rp.push(esc(r[15]));if(r[16])rp.push('V-chip '+esc(r[16].split(',').join(' ')));if(rp.length)h+='<div>Rating: '+rp.join(' &middot; ')+'</div>';if(r[14])h+='<div class="desc">'+esc(D.ds[r[14]-1])+'</div>';
if(r[6]||r[10])h+='<div>'+(r[6]?'Radar ID: '+esc(r[6]):'')+(r[6]&&r[10]?' &middot; ':'')+(r[10]?'House #: '+esc(r[10]):'')+'</div>';h+='<div>'+(r[7]?'Re-air':'Original')+(r[9]?' &middot; LIVE':'')+(r[11]?' &middot; '+esc(r[11]):'')+'</div>';
if(r[8])h+='<div>Kill date: '+fmt(r[8],{month:'short',day:'numeric',year:'numeric'})+' '+tm(r[8])+'</div>';

tip.innerHTML=h;tip.style.display='block';moveTip(e)}
function moveTip(e){var x=e.clientX+14,y=e.clientY+14,w=tip.offsetWidth,hh=tip.offsetHeight;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+hh>innerHeight-8)y=e.clientY-hh-14;tip.style.left=x+'px';tip.style.top=y+'px'}
function render(){var day=days[dayIdx],W=(day.e-day.s)/60000*PPM;var g=document.getElementById('grid');curW=W;g.style.width=(LW+W)+'px';g.innerHTML='';
var hd=document.createElement('div');hd.className='row hdr';var c=document.createElement('div');c.className='name';c.textContent='Network';var rs=document.createElement('div');rs.className='rs';rs.title='Drag to resize (double-click to reset)';c.appendChild(rs);
function setLW(v){LW=Math.max(160,Math.min(700,Math.round(v)));document.documentElement.style.setProperty('--lw',LW+'px');g.style.width=(LW+curW)+'px'}
rs.addEventListener('pointerdown',function(e){e.preventDefault();var x0=e.clientX,w0=LW;rs.classList.add('on');rs.setPointerCapture(e.pointerId);
rs.onpointermove=function(ev){setLW(w0+ev.clientX-x0)};
rs.onpointerup=function(){rs.classList.remove('on');rs.onpointermove=null;rs.onpointerup=null;try{localStorage.setItem('roz-lw',LW)}catch(e){}}});
rs.addEventListener('dblclick',function(){setLW(320);try{localStorage.setItem('roz-lw',LW)}catch(e){}});
hd.appendChild(c);var ln=document.createElement('div');ln.className='lane';ln.style.width=W+'px';
for(var t=day.s;t<day.e;t+=1800000){var x=(t-day.s)/60000*PPM;var tk=document.createElement('div');var on=(t-day.s)%3600000===0;tk.className='tick'+(on?' hr':'');tk.style.left=x+'px';if(on)tk.textContent=tm(t);ln.appendChild(tk)}
hd.appendChild(ln);g.appendChild(hd);var total=0,shown=0,term=q.toLowerCase();
D.nets.forEach(function(n){var row=document.createElement('div');row.className='row';var nm=document.createElement('div');nm.className='name';var cnt=0;var lane=document.createElement('div');lane.className='lane';lane.style.width=W+'px';
for(var t2=day.s;t2<day.e;t2+=3600000){var gl=document.createElement('div');gl.className='gl';gl.style.left=((t2-day.s)/60000*PPM)+'px';lane.appendChild(gl)}
n.rows.forEach(function(r){if(r[1]<=day.s||r[0]>=day.e)return;cnt++;var a=Math.max(r[0],day.s),b=Math.min(r[1],day.e);var d=document.createElement('div');var cls='a '+(!isEp(r)||r[9]?'x':(r[7]?'re':'or'));if(term){var hay=((r[2]||'')+' '+(r[6]||'')+' '+(r[10]||'')+' '+(r[12]||'')).toLowerCase();if(hay.indexOf(term)<0)cls+=' dim';else shown++}d.className=cls;d.style.left=((a-day.s)/60000*PPM)+'px';d.style.width=Math.max(2,(b-a)/60000*PPM-2)+'px';
var l1=isEp(r)?'S'+r[3]+' E'+r[4]:(r[2]||'');d.innerHTML='<span class="l1">'+(r[9]?'LIVE ':'')+esc(l1)+'</span><span class="l2">'+tm(r[0])+'</span>';
d.addEventListener('mouseenter',function(e){showTip(e,r,n)});d.addEventListener('mousemove',moveTip);d.addEventListener('mouseleave',function(){tip.style.display='none'});lane.appendChild(d)});
total+=cnt;var rw=RW[n.n],dc=rw?({red:'#C8312B',amber:'#F29A2E',green:'#3A9D48'}[rw.tier]||'#C9CCD6'):'#C9CCD6';nm.title=n.n+(rw&&rw.days_left!=null?' \u00b7 '+rw.days_left.toFixed(1)+' days of runway':'')+(rw&&rw.gap?' \u00b7 gap starting '+fmt(rw.gap.start_ms,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'');nm.innerHTML='<span class="nn"><i class="dot" style="background:'+dc+'"></i>'+esc(n.n)+'</span><span class="nc">'+cnt+' airings'+(rw&&rw.gap?' \u00b7 <span style="color:#1C7293;font-weight:700">gap ahead</span>':'')+'</span>';row.appendChild(nm);row.appendChild(lane);g.appendChild(row)});
document.getElementById('sum').textContent=D.nets.length+' networks \u00b7 '+total+' airings'+(term?' \u00b7 '+shown+' match':'');
if(total===0)document.getElementById('sum').textContent+=' - no data for this date (data covers '+fmt(minS,{month:'short',day:'numeric'})+' to '+fmt(maxE-1,{month:'short',day:'numeric'})+')';document.getElementById('day').value=dayIdx;document.getElementById('prev').disabled=dayIdx===0;document.getElementById('next').disabled=dayIdx===days.length-1}
function fillDays(){var s=document.getElementById('day');s.innerHTML='';days.forEach(function(d,i){var o=document.createElement('option');o.value=i;o.textContent=fmt(d.s+3600000,{weekday:'short',month:'short',day:'numeric',year:'numeric'})+(i===0?' (today)':'');s.appendChild(o)})}
var sz=document.getElementById('tz');TZS.forEach(function(t){var o=document.createElement('option');o.value=t[1];o.textContent=t[0];sz.appendChild(o)});sz.value=tz;
sz.onchange=function(){var cur=days[dayIdx].s;tz=sz.value;buildDays();dayIdx=0;for(var i=0;i<days.length;i++){if(days[i].e>cur){dayIdx=i;break}}fillDays();render()};
document.getElementById('day').onchange=function(){dayIdx=+this.value;render();document.getElementById('wrap').scrollLeft=0};
document.getElementById('prev').onclick=function(){if(dayIdx>0){dayIdx--;render()}};document.getElementById('next').onclick=function(){if(dayIdx<days.length-1){dayIdx++;render()}};
document.getElementById('q').oninput=function(){q=this.value;render()};
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft'&&dayIdx>0){dayIdx--;render()}if(e.key==='ArrowRight'&&dayIdx<days.length-1){dayIdx++;render()}});
buildDays();fillDays();render();document.getElementById('meta').textContent='Source: PCC airings API \u00b7 refreshed '+fmt(D.asof,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});

window.__ready=true}
Promise.all([fetch('data/grid.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}),fetch('data/runway.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})]).then(function(a){RW={};if(a[1]&&a[1].channels)a[1].channels.forEach(function(c){RW[c.name]=c});start(adapt(a[0]))}).catch(function(e){document.getElementById('sum').textContent='Could not load schedule data ('+e.message+').'});
})()</script></body></html>
