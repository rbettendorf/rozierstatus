<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roz-ier: FAST Channels Runway</title><link rel="icon" href="roz-logo.png">
<style>
:root{--navy:#0D1551;--royal:#1750A8;--teal:#1C7293;--text:#0B1A3E;--gray:#5E5E5E;--light:#F4F5F8;--rule:#E5E7EB;--red:#C8312B;--amber:#F29A2E;--green:#3A9D48;--font:"Helvetica Neue",Helvetica,"Avenir Next",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--font);color:var(--gray);background:#fff;font-size:14px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:20px 32px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top img{height:52px;width:auto}
h1{margin:0;font-size:26px;font-weight:700;color:#fff}
.sub{margin-top:6px;font-size:13px;color:#fff;opacity:.9}
.nav{margin-left:auto;color:#fff;text-decoration:none;border-bottom:1px solid #fff;font-size:13px}
main{max-width:1080px;margin:0 auto;padding:28px 32px 48px}
.kpis{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.kpi{flex:1;min-width:160px;background:var(--light);border-radius:8px;padding:16px 20px;border-left:6px solid var(--rule)}
.kpi b{display:block;font-size:30px;color:var(--text);line-height:1.1}
.kpi span{font-size:13px}
.kpi.red{border-left-color:var(--red)}.kpi.amber{border-left-color:var(--amber)}.kpi.green{border-left-color:var(--green)}
.goal{margin:12px 0 0;color:var(--text)}
h2{font-size:20px;color:var(--text);margin:36px 0 4px;display:flex;align-items:baseline;gap:10px}
h2 small{font-size:13px;font-weight:400;color:var(--gray)}
.bar-h{height:4px;border-radius:2px;margin-bottom:10px}
.row{display:grid;grid-template-columns:300px 1fr 170px;gap:14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.nm{color:var(--text);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:14px;background:var(--light);border-radius:7px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.tk{position:absolute;top:-3px;bottom:-3px;width:1px;background:#9AA0B4}
.dl{text-align:right;white-space:nowrap}.dl b{color:var(--royal)}.dl i{display:block;font-style:normal;font-size:12px}
.axis{display:grid;grid-template-columns:300px 1fr 170px;gap:14px;font-size:11px;color:var(--gray);margin-top:8px}
.axis div{position:relative;height:14px}.axis span{position:absolute;transform:translateX(-50%)}
.kpi.gap{border-left-color:var(--teal)}.headsup{margin:20px 0 0;background:var(--light);border-left:4px solid var(--navy);border-radius:0 8px 8px 0;padding:12px 16px;color:var(--text)}.headsup b.t{display:block;margin-bottom:4px}.headsup small{display:block;margin-top:4px;color:var(--gray);font-size:12px}.gp{color:var(--teal)}.sb{font-size:12px;color:var(--gray);font-weight:400;white-space:normal}.stale{background:#FFF4E0;border-left:4px solid #F29A2E;color:#0B1A3E;padding:10px 16px;font-size:13px;line-height:1.4}.tr{display:block;font-style:normal;font-size:12px}.tr.up{color:#3A9D48}.tr.dn{color:#C8312B}.tr.eq{color:var(--gray)}.trend{margin:6px 0 0;color:var(--text)}.none{padding:8px 0;color:var(--gray)}
.inact{margin-top:36px;font-size:13px}
footer{background:linear-gradient(90deg,#0D1551 0%,#1C7293 100%);color:#fff;padding:14px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:12px}
footer img{height:26px;width:auto}
@media(max-width:760px){.row,.axis{grid-template-columns:1fr}.dl{text-align:left}.axis{display:none}main,header,footer{padding-left:16px;padding-right:16px}}
</style></head><body>
<header><div class="top"><img src="roz-logo.png" alt="Roz"><div><h1>Roz-ier: FAST Channels Runway</h1><div class="sub" id="asof">Loading...</div></div><a class="nav" href="index.html">Schedule grid</a></div></header>
<div id="stale"></div>
<main>
<div class="kpis" id="kpis"></div>
<p class="goal">Goal: stay 30+ days ahead. Red zone is under 14 days of scheduled content. Runway is the end of each channel's last scheduled airing.</p>
<p class="trend" id="trend"></p>
<div id="zones"></div>
<p class="inact" id="inact"></p>
</main>
<footer><span>For Internal Use Only &middot; Private &amp; Confidential</span><img src="det_wordmark_white.png" alt="Disney Entertainment"></footer>
<script>
(function(){
var MAXD=60,COL={red:'#C8312B',amber:'#F29A2E',green:'#3A9D48'};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f(ms,o){return new Intl.DateTimeFormat('en-US',Object.assign({timeZone:'America/Los_Angeles'},o)).format(new Date(ms))}
function tier(d,R){return d===null||d<R.red_days?'red':(d<R.green_days?'amber':'green')}
function dur(ms){var m=ms/60000;if(m<120)return Math.round(m)+' min';var h=m/60;return h<48?Math.round(h)+' hrs':(h/24).toFixed(1)+' days'}
function headsup(ch,R,now){var hz=now+10*864e5,g={},keys=[];ch.forEach(function(c){if(c.ro&&c.ro>now&&c.ro<=hz){var k=f(c.ro,{weekday:'short',month:'short',day:'numeric'});if(!g[k]){g[k]={n:0,t:c.ro};keys.push(k)}g[k].n++;if(c.ro<g[k].t)g[k].t=c.ro}});
if(!keys.length)return'';keys.sort(function(a,b){return g[a].t-g[b].t});
return'<div class="headsup"><b class="t">Heads-up: next 10 days</b>'+keys.map(function(k){var n=g[k].n;return'<div><b>'+n+' channel'+(n===1?'':'s')+'</b> enter'+(n===1?'s':'')+' the red zone on <b>'+k+'</b></div>'}).join('')+'<small>Based on each channel\'s last scheduled airing. Scheduling more content moves these dates out.</small></div>'}
function staleMsg(asof){var now=Date.now();if(now-asof<26*36e5)return'';
function pt(ms,o){return new Intl.DateTimeFormat('en-US',Object.assign({timeZone:'America/Los_Angeles'},o)).format(new Date(ms))}
var wd=pt(asof,{weekday:'short'});
if(wd==='Fri'||wd==='Sat'||wd==='Sun'){var t=asof;for(var i=0;i<200;i++){t+=36e5;if(pt(t,{weekday:'short'})==='Mon'&&+pt(t,{hour:'numeric',hourCycle:'h23'})===9)break}if(now<t)return''}
var h=(now-asof)/36e5,age=h<48?Math.round(h)+' hours':(h/24).toFixed(1)+' days';
return'<b>This data is '+age+' old</b> (last refreshed '+pt(asof,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' PT). The daily refresh may not have run, so these numbers may be out of date.'}
function pl(d){var x=new Date(d+'T12:00:00Z');return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'}).format(x)}
function trendTxt(c){if(c.dd==null||!c.pd)return'';if(c.dd>0)return'<i class="tr up">&#9650; +'+c.dd.toFixed(1)+' days since '+pl(c.pd)+'</i>';if(c.dd<0)return'<i class="tr dn">&#9660; '+c.dd.toFixed(1)+' days since '+pl(c.pd)+'</i>';return'<i class="tr eq">no change since '+pl(c.pd)+'</i>'}
fetch('data/runway.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(R){
var now=Date.now();
var ch=R.channels.map(function(c){var d=c.end_ms==null?null:(c.end_ms-now)/864e5;return{n:c.name,end:c.end_ms,d:d,t:tier(d,R),gap:c.gap||null,ro:c.red_on_ms||null,dd:(c.delta_days===undefined?null:c.delta_days),pd:c.prev_date||null,th:c.through||null,nd:c.needs||null,due:c.due_ms||null}});
ch.sort(function(a,b){return(a.d===null?-1:a.d)-(b.d===null?-1:b.d)});
document.getElementById('asof').textContent='Data refreshed '+f(R.asof_ms,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' PT';
var cnt={red:0,amber:0,green:0};ch.forEach(function(c){cnt[c.t]++});
var lab={red:['Red','under '+R.red_days+' days'],amber:['Amber',R.red_days+' to '+(R.green_days-1)+' days'],green:['Green',R.green_days+'+ days']};
var sm=staleMsg(R.asof_ms);if(sm){var sb=document.getElementById('stale');sb.className='stale';sb.innerHTML=sm}
var hv=ch.filter(function(c){return c.pd});if(hv.length){var up=hv.filter(function(c){return c.dd>0}).length,dn=hv.filter(function(c){return c.dd<0}).length;document.getElementById('trend').innerHTML='<b>Since '+pl(hv[0].pd)+':</b> <span style="color:#3A9D48">'+up+' extended</span> &middot; <span style="color:#C8312B">'+dn+' shortened</span> &middot; '+(hv.length-up-dn)+' unchanged'}
document.getElementById('kpis').innerHTML=['red','amber','green'].map(function(t){return'<div class="kpi '+t+'"><b>'+cnt[t]+'</b><span>'+lab[t][0]+' &middot; '+lab[t][1]+'</span></div>'}).join('')+(function(){var n=ch.filter(function(c){return c.gap}).length;return'<div class="kpi gap"><b>'+n+'</b><span>Gaps &middot; empty stretches, next 30 days</span></div>'})();
var z=headsup(ch,R,now);
['red','amber','green'].forEach(function(t){
 var list=ch.filter(function(c){return c.t===t});
 z+='<h2>'+lab[t][0]+' <small>'+lab[t][1]+' &middot; '+list.length+' channel'+(list.length===1?'':'s')+'</small></h2><div class="bar-h" style="background:'+COL[t]+'"></div>';
 if(!list.length){z+='<div class="none">None.</div>';return}
 list.forEach(function(c){
  var w=c.d===null?0:Math.max(0,Math.min(100,c.d/MAXD*100));
  var sb=(c.nd&&c.due)?'<div class="sb">Through '+esc(c.th)+' &middot; needs '+esc(c.nd)+' &middot; '+(c.due<now?'was due ':'due ')+f(c.due,{weekday:'short',month:'short',day:'numeric'})+'</div>':'';
  z+='<div class="row"><div><div class="nm" title="'+esc(c.n)+'">'+esc(c.n)+'</div>'+sb+'</div><div class="track"><div class="fill" style="width:'+w+'%;background:'+COL[t]+'"></div><div class="tk" style="left:'+(R.red_days/MAXD*100)+'%"></div><div class="tk" style="left:'+(R.green_days/MAXD*100)+'%"></div></div><div class="dl">'+(c.d===null?'<b>no schedule</b>':'<b>'+c.d.toFixed(1)+' days left</b><i>ends '+f(c.end,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</i>')+trendTxt(c)+(c.gap?'<i class="gp">gap '+f(c.gap.start_ms,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' &middot; '+dur(c.gap.end_ms-c.gap.start_ms)+(c.gap.count>1?' (+'+(c.gap.count-1)+' more)':'')+'</i>':'')+'</div></div>';
 });
 if(t==='green'||list.length)z+='';
});
z+='<div class="axis"><span></span><div><span style="left:'+(R.red_days/MAXD*100)+'%">'+R.red_days+' days</span><span style="left:'+(R.green_days/MAXD*100)+'%">'+R.green_days+' days</span><span style="left:100%">'+MAXD+'+</span></div><span></span></div>';
document.getElementById('zones').innerHTML=z;
document.getElementById('inact').textContent=R.inactive.length+' inactive channels with no schedule are not monitored.';
}).catch(function(e){document.getElementById('asof').textContent='Could not load runway data ('+e.message+').'});
})();
</script></body></html>
